<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1F1611" />
<title>La Familia Community Scholarship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..600&display=swap" rel="stylesheet">
<style>
  :root {
    --bone: #F2EAD8;
    --bone-deep: #E8DDC4;
    --paper: #F7F0DE;
    --ink: #1F1611;
    --ink-soft: #3A2A1F;
    --terracotta: #B5482C;
    --terracotta-deep: #8E351F;
    --copper: #2C4A42;
    --copper-deep: #1E332E;
    --gold: #C99A3A;
    --gold-soft: #D9B056;
    --muted: rgba(31, 22, 17, 0.55);
    --rule: rgba(31, 22, 17, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bone);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Warm grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.12;
    mix-blend-mode: multiply;
  }

  /* ============ TYPOGRAPHY ============ */
  .display, h1, h2, h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144, 'SOFT' 30, 'WONK' 0;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .eyebrow-accent { color: var(--terracotta); }

  /* ============ LAYOUT ============ */
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 28px;
  }

  section { position: relative; }

  /* ============ HERO ============ */
  .hero {
    min-height: 100svh;
    min-height: 100vh;
    padding: 64px 28px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .hero-headline {
    margin: 0 -4px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.3s forwards;
  }

  .hero-headline .familia {
    display: block;
    font-size: clamp(48px, 18vw, 84px);
    font-weight: 600;
    color: var(--ink);
    line-height: 0.95;
    letter-spacing: -0.04em;
    font-variation-settings: 'opsz' 144, 'SOFT' 20;
    margin-bottom: 0.1em;
  }

  .hero-headline .sub {
    display: block;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 5vw, 24px);
    color: var(--copper);
    letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 36, 'SOFT' 60;
  }

  .hero-mission {
    margin-top: 20px;
    font-family: 'Fraunces', serif;
    font-size: clamp(18px, 5vw, 22px);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 400px;
    font-weight: 400;
    letter-spacing: -0.012em;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.7s forwards;
  }

  .hero-mission em {
    font-style: italic;
    color: var(--terracotta);
    font-variation-settings: 'opsz' 36, 'SOFT' 80;
  }

  .hero-bottom {
    opacity: 0;
    animation: fadeIn 1.2s ease-out 1.2s forwards;
  }

  /* ============ LINKS SECTION ============ */
  .links-section {
    padding: 72px 0 88px;
    background: var(--bone);
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: var(--ink);
    font-variation-settings: 'opsz' 144, 'SOFT' 30;
    margin-bottom: 40px;
  }

  .section-title em {
    font-style: italic;
    color: var(--terracotta);
    font-variation-settings: 'opsz' 144, 'SOFT' 100, 'WONK' 1;
  }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav-list li {
    margin: 0;
    padding: 0;
  }

  .nav-list a {
    display: block;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    font-family: 'Fraunces', serif;
    letter-spacing: -0.015em;
    transition: all 0.2s ease;
    font-variation-settings: 'opsz' 36, 'SOFT' 40;
  }

  .nav-list a:hover {
    background: var(--bone-deep);
    border-color: var(--terracotta);
    color: var(--terracotta);
  }

  .nav-list a em {
    font-style: italic;
    color: var(--terracotta);
    font-variation-settings: 'opsz' 36, 'SOFT' 80, 'WONK' 1;
  }

  /* Coming soon badge */
  .coming-soon {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 6px;
    background: rgba(181, 72, 44, 0.1);
    border: 1px solid var(--terracotta);
    border-radius: 2px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-family: 'DM Sans', sans-serif;
  }

  .nav-list .coming-soon-item a {
    background: rgba(181, 72, 44, 0.04);
    border-color: rgba(181, 72, 44, 0.25);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .nav-list .coming-soon-item a:hover {
    background: rgba(181, 72, 44, 0.08);
    border-color: rgba(181, 72, 44, 0.3);
    color: var(--ink-soft);
  }

  /* ============ FOOTER ============ */
  .footer {
    padding: 48px 28px 56px;
    background: var(--bone);
    border-top: 1px solid var(--rule);
    text-align: center;
  }

  .footer p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }

  .footer em {
    font-style: italic;
    color: var(--terracotta);
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-headline">
    <span class="familia">La Familia</span>
    <span class="sub">Community Scholarship</span>
  </div>
  <div class="hero-mission">
    <em>Investing</em> in young leaders from underrepresented communities in tech.
  </div>
  <div class="hero-bottom"></div>
</section>

<section class="links-section">
  <div class="container">
    <h2 class="section-title">Our <em>Work</em></h2>
    <ul class="nav-list">
      <li>
        <a href="update-2026-05.html">May 2026 <em>Committee Update</em></a>
      </li>
      <li class="coming-soon-item">
        <a>Initiative <em>One-Pager</em> <span class="coming-soon">Coming Soon</span></a>
      </li>
      <li class="coming-soon-item">
        <a>Committee <em>Deck</em> <span class="coming-soon">Coming Soon</span></a>
      </li>
    </ul>
  </div>
</section>

<section class="footer">
  <p>La Familia Community Scholarship · Chicago · <em>2026</em></p>
  <p style="margin-top: 12px; font-size: 13px;">Public initiative documentation</p>
</section>

</body>
</html>
